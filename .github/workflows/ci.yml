name: Validate service
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libgomp1
      - run: pip install -r requirements.lock.txt && pip install --no-deps --no-build-isolation -e .
      - run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build && pnpm --dir web lint
      - run: python scripts/setup_env.py
      - run: pytest -q -p no:cacheprovider
      - run: docker compose up -d postgres object-store --wait --wait-timeout 180
      - run: pytest tests/test_integration.py -q -p no:cacheprovider
        env:
          VIDEO_CONTEXT_INTEGRATION: '1'
      - if: always()
        run: docker compose down
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
